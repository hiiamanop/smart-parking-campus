services:
  redis:
    image: redis:alpine
    container_name: smart-parking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - supabase

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: smart-parking-api:latest
    container_name: smart-parking-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VLM_PROXY_HOST: 0.0.0.0
      VLM_PROXY_PORT: 8788
      REDIS_URL: redis://redis:6379
      TZ: Asia/Jakarta
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - history-data:/app/data/history
    ports:
      # Hanya untuk tes lokal. Publik lewat Cloudflare Tunnel.
      - "127.0.0.1:8788:8788"
    networks:
      - supabase

  driver:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: smart-parking-web:latest
    container_name: smart-parking-driver
    restart: unless-stopped
    environment:
      APP_DIR: /app/dist/client
      API_TARGET: http://api:8788
    depends_on:
      - api
    ports:
      - "0.0.0.0:8081:8080"
    networks:
      - supabase

  admin:
    image: smart-parking-web:latest
    container_name: smart-parking-admin
    restart: unless-stopped
    environment:
      APP_DIR: /app/dist/admin
      API_TARGET: http://api:8788
    depends_on:
      - driver
    ports:
      - "0.0.0.0:8082:8080"
    networks:
      - supabase

  gate:
    image: smart-parking-web:latest
    container_name: smart-parking-gate
    restart: unless-stopped
    environment:
      APP_DIR: /app/dist/gate
      API_TARGET: http://api:8788
    depends_on:
      - driver
    ports:
      - "0.0.0.0:8083:8080"
    networks:
      - supabase

volumes:
  redis-data:
  history-data:

networks:
  supabase:
    external: true
    name: supabase_default
